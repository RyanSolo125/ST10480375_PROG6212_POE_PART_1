name: Database CI

on:
  push:
    paths:
      - 'Documents/**.sql'
  pull_request:
    paths:
      - 'Documents/**.sql'
  workflow_dispatch:

jobs:
  validate-sql:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrong!Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sqlcmd
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Create the database
        run: sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q "CREATE DATABASE RaceDayDB;"

      - name: Run the rest of the script (tables + sample data)
        run: |
          tail -n +2 Documents/RaceDayDB.sql | sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -d RaceDayDB

      - name: Sanity-check row counts
        run: |
          sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -d RaceDayDB -Q "
            SET NOCOUNT ON;
            SELECT 'Users' AS TableName, COUNT(*) AS Rows FROM Users
            UNION ALL SELECT 'Events', COUNT(*) FROM Events
            UNION ALL SELECT 'Categories', COUNT(*) FROM Categories
            UNION ALL SELECT 'Enrolments', COUNT(*) FROM Enrolments
            UNION ALL SELECT 'Results', COUNT(*) FROM Results
            UNION ALL SELECT 'Payments', COUNT(*) FROM Payments;
          "
